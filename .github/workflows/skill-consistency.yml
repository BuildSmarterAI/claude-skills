name: Skill consistency

# Enforces canonical repository integrity on every PR and every push to main.
#
# This gate answers ONE question: is the canonical repository internally correct?
# It deliberately does NOT run `deploy-skills.py --check`, which compares canonical
# against the live ~/.claude/skills and ~/.agents/skills stores. A CI runner has
# neither, so that command reports every declared skill as a false CREATE
# (measured: 246 on an empty runner). Runtime parity is a local question.
# See docs/consolidation/README.md.

on:
  pull_request:
  push:
    branches: [main]

# Read-only. This workflow needs no secrets, writes nothing, and deploys nothing.
permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch containment is measured across full history, and the health
          # audit compares the retention record against the branches that
          # actually exist on origin. A shallow, single-ref checkout would make
          # every recorded branch look absent - which fires the preservation
          # alarm on nothing at all.
          fetch-depth: 0

      - name: Fetch remote branch refs
        # `actions/checkout` leaves no refs/remotes/origin/* entries behind. The
        # audit treats an unenumerable remote as UNKNOWN rather than empty, so
        # without this the branch checks would skip rather than run.
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checker self-tests
        # The gate is only worth as much as its own tests: a checker that passes
        # vacuously would report success on a broken repository.
        run: python -m unittest discover -s tests -v

      - name: Canonical skill consistency
        run: python scripts/check-skill-consistency.py

      - name: Catalog health audit
        # The complement to the checker: the checker proves the record is
        # internally valid, this proves the record still matches reality.
        # --no-runtime because a runner has no ~/.claude or ~/.agents; that
        # section reports itself as SKIPPED rather than passing silently.
        run: python scripts/audit-catalog-health.py --no-runtime

      - name: Branch containment
        # --advisory because this is a REPORTING run: losing an older revision
        # of a path main still carries is a judgement call, and CI must not fail
        # on a condition no commit caused. Only-copy loss still blocks even here.
        # The bare command, which is what an operator runs immediately before a
        # deletion, blocks on ANY content loss.
        #
        # Guarded because the verifier REFUSES (exit 2) when it has no retention
        # record at all, and manifests/retention.json only lands with the
        # retention policy PR. A record listing zero deletable branches is a
        # definite answer and passes. The guard is explicit and printed: an
        # invisible skip is the failure mode this whole workflow exists to prevent.
        run: |
          if [ -f manifests/retention.json ]; then
            python scripts/verify-branch-containment.py --advisory
          else
            echo "::notice title=Branch containment skipped::manifests/retention.json is not present on this ref, so no branch is marked deletable and there is nothing to verify. This step activates automatically when the retention policy merges."
          fi
